spring:
  application:
    name: order-management-demo
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  jpa:
    hibernate:
      ddl-auto: create-drop
server:
  address: 127.0.0.1
  port: 8080
app:
  export:
    directory: ./exports
    scheduling:
      enabled: false
      fixed-delay: 60000
